{% extends "base.html" %}
{% block titulo %}Iniciar sesión — Blog Web{% endblock %}
{% block contenido %}
    <section class="panel panel-auth">
        <div class="icono-panel">🔐</div>
        <h1>Iniciar sesión</h1>
        <p class="subtitulo">Qué bueno verte de nuevo. Ingresá a tu cuenta.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button class="boton" type="submit">Ingresar</button>
        </form>
        <p class="panel-pie">¿No tenés cuenta? <a href="{% url 'registro' %}">Registrate</a></p>
    </section>
{% endblock %}
