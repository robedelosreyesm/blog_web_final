{% extends "base.html" %}
{% block titulo %}Eliminar post — Blog Web{% endblock %}
{% block contenido %}
    <section class="panel panel-auth panel-peligro">
        <div class="icono-panel">🗑️</div>
        <h1>¿Eliminar este post?</h1>
        <p class="subtitulo">Estás por eliminar <strong>{{ post.titulo }}</strong>. Esta acción no se puede deshacer.</p>
        <form method="post">
            {% csrf_token %}
            <button class="boton peligro" type="submit">Sí, eliminar</button>
            <a class="boton secundario" href="{{ post.get_absolute_url }}">Cancelar</a>
        </form>
    </section>
{% endblock %}
