{% extends "base.html" %}
{% block titulo %}{{ titulo_pagina }} — Blog Web{% endblock %}
{% block contenido %}
    <section class="panel">
        <h1>{{ titulo_pagina }}</h1>
        <p class="subtitulo">Completá los campos y compartí tu publicación con todos.</p>
        <form class="form-post" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="boton" type="submit">💾 Guardar</button>
        </form>
    </section>
{% endblock %}
